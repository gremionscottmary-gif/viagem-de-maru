
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seu trajeto :P</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="56224695344760420-removebg-preview.png">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: black;
        }

        .cena {
            position: fixed;
            inset: 0;
            background-image: url("385739_jpg (3840×2160).jpg");
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .estrada {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
        }

        #abrir-olhos {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 100;
            clip-path: inset(0 0 0 0);
            transition: clip-path 1.5s ease-in-out;
        }

        #abrir-olhos.aberto {
            clip-path: inset(0 0 100% 0);
        }
    </style>
</head>

<body>

    <div class="cena"></div>

    <img src="estrada.png" class="estrada" alt="">

    <div id="abrir-olhos"></div>

    <script>
        setTimeout(function() {
            document.getElementById("abrir-olhos").classList.add("aberto");
        }, 300);
    </script>

</body>
</html>
