  <!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Seu trajeto :P</title>
    <meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="56224695344760420-removebg-preview.png">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: black;
        }

        #abrir-olhos {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 100;

            clip-path: inset(0 0 0 0);

            transition: clip-path 1.5s ease-in-out;
        }

        #abrir-olhos.aberto {
            clip-path: inset(0 0 100% 0);
        }

        .cena {
            width: 100%;
            height: 100%;
            background-image: url("car.jpg");
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body>

    <div class="cena"></div>

    <div id="abrir-olhos"></div>

    <script>
        setTimeout(function() {
            document.getElementById("abrir-olhos").classList.add("aberto");
        }, 300);
    </script>

</body>
</html>
