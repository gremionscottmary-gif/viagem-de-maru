<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seu trajeto :P</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="56224695344760420-removebg-preview.png">

    <style>
        /* TRANSIÇÃO DA PORTA */
#transicao-porta {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url("porta.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 99999;
    pointer-events: none;
    transform: translateX(-100%);
}

#transicao-porta.abrindo {
    animation: abrirPorta 1.2s ease-in-out forwards;
}

@keyframes abrirPorta {
    from {
        transform: translateX(-100%);
    }
    to {
        transform: translateX(100%);
    }
}
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: black;
        }

        .cena {
            position: fixed;
            inset: 0;
            background-image: url("385739_jpg (3840×2160).jpg");
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .estrada {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
            pointer-events: none;
        }

        #abrir-olhos {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 100;
            clip-path: inset(0 0 0 0);
            transition: clip-path 1.5s ease-in-out;
        }

        #abrir-olhos.aberto {
            clip-path: inset(0 0 100% 0);
        }

        /* ÍCONES DA VIAGEM */

        .objeto {
            position: fixed;
            z-index: 2;
            cursor: pointer;
            animation: movimento-colagem 1.2s steps(1, end) infinite;
        }

        .objeto img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s ease;
        }

        @keyframes movimento-colagem {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            20% {
                transform: translate(3px, -2px) rotate(1deg);
            }

            40% {
                transform: translate(-2px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(2px, 1px) rotate(0.5deg);
            }

            80% {
                transform: translate(-3px, -1px) rotate(-0.5deg);
            }

            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        .objeto:hover {
            animation-play-state: paused;
            z-index: 10;
        }

        .objeto:hover img {
            transform: scale(1.12);
        }

        /* POSIÇÕES DOS OBJETOS */

        .carro {
            top: 20%;
            left: 0%;
            width: 19vw;
            animation-delay: 0s;
        }

     .carro img {
    transform: rotate(90deg) scaleX(-1);
}

.carro:hover img {
    transform: rotate(90deg) scaleX(-1) scale(1.12);
}

        .loja {
            top: -1%;
            left: 23%;
            width: 23vw;
            animation-delay: 0.3s;
        }

        .notebook {
            top: 6%;
            left: 66%;
            width: 18vw;
            animation-delay: 0.6s;
        }

        .album {
            top: 59%;
            left: 0%;
            width: 17vw;
            animation-delay: 0.2s;
        }

        .mochila {
            top: 58%;
            left: 40%;
            width: 18vw;
            animation-delay: 0.5s;
        }

        .calendario {
            top: 54%;
            left: 80%;
            width: 16vw;
            animation-delay: 0.8s;
        }
    </style>
</head>

<body>

    <div class="cena"></div>

    <img src="estrada.png" class="estrada" alt="">

    <!-- CARRO -->
   <div class="objeto carro"
     onclick="window.location.href='carro.html'">
    <img src="carro-removebg-preview.png" alt="Carro">
</div>

<!-- LOJA DE CONVENIÊNCIA -->
<div class="objeto loja">
    <a href="#" onclick="entrarLanchonete(); return false;">
        <img src="lanche-removebg-preview.png" alt="Loja">
    </a>
</div>

    <!-- NOTEBOOK -->
    <div class="objeto notebook">
        <img src="notebook-removebg-preview.png" alt="Notebook">
    </div>

    <!-- ÁLBUM -->
    <div class="objeto album">
        <img src="livro-removebg-preview.png" alt="Álbum">
    </div>

    <!-- MOCHILA -->
    <div class="objeto mochila">
        <img src="mochila-removebg-preview.png" alt="Mochila">
    </div>

    <!-- CALENDÁRIO -->
    <div class="objeto calendario">
        <img src="Calendário-removebg-preview.png" alt="Calendário">
    </div>

    <div id="abrir-olhos"></div>

    <script>
        setTimeout(function() {
            document.getElementById("abrir-olhos").classList.add("aberto");
        }, 300);
        <div id="transicao-porta"></div>
        <script>
function entrarLanchonete() {
    const porta = document.getElementById("transicao-porta");

    porta.classList.add("abrindo");

    setTimeout(function() {
        window.location.href = "lanchonete.html";
    }, 1200);
}
</script>
    </script>

</body>
</html>
