
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dentro do carro!</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-image: url("interior-carro.jpg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* SETA DE VOLTAR - ESTILO WINDOWS */

        .voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;

            width: 42px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c0c0c0;
            color: black;
            text-decoration: none;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 25px;
            font-weight: bold;

            border-top: 2px solid white;
            border-left: 2px solid white;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;

            box-shadow: 1px 1px 0 black;
        }

        .voltar:active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
        }

        /* TELA DE INICIALIZAÇÃO */

        #transicao-inicial {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: opacity 0.8s ease;
        }

        #transicao-inicial.finalizando {
            opacity: 0;
            pointer-events: none;
        }

        .carregamento {
            width: min(420px, 75vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 17px;
        }

        .titulo-inicial {
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 20px;
            margin-bottom: 12px;
        }

        /* BARRA */

        .barra-fundo {
            position: relative;
            width: 100%;
            height: 17px;

            background: #171717;
            border: 2px solid #777;
            box-shadow: inset 1px 1px 3px black;
        }

        .barra-preenchida {
            width: 0%;
            height: 100%;
            background: #2868c7;

            animation: carregar 4.2s linear forwards;
        }

        @keyframes carregar {
            to {
                width: 100%;
            }
        }

        /* CARRINHO DA BARRA */

        .carro-carregando {
            position: absolute;
            width: 55px;
            height: 45px;
            bottom: 12px;
            left: 0;

            animation: andar-carro 4.2s linear forwards;
        }

        .carro-carregando img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(90deg) scaleX(-1);
        }

        @keyframes andar-carro {
            from {
                left: 0%;
            }

            to {
                left: calc(100% - 55px);
            }
        }

        /* BEM-VINDO */

        .bem-vindo {
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 15px;

            opacity: 0;
            animation: aparecer 1.5s ease 1.2s forwards;
        }

        @keyframes aparecer {
            to {
                opacity: 1;
            }
        }

    </style>
</head>

<body>

    <!-- TELA DE CARREGAMENTO -->

    <div id="transicao-inicial">

        <div class="carregamento">

            <div class="titulo-inicial">
                Iniciando viagem...
            </div>

            <div class="barra-fundo">

                <div class="barra-preenchida"></div>

                <div class="carro-carregando">
                    <img src="carro-removebg-preview.png" alt="">
                </div>

            </div>

            <div class="bem-vindo">
                Bem-vindo!
            </div>

        </div>

    </div>

    <!-- BOTÃO DE VOLTAR -->

    <a href="viagem.html" class="voltar">←</a>

    <!-- SOM DE INICIALIZAÇÃO -->

    <audio id="som-inicial" src="som-windows.mp3" preload="auto"></audio>

    <script>
        const transicao = document.getElementById("transicao-inicial");

        const som = document.getElementById("som-inicial");

        som.volume = 0.35;

        som.play().catch(function() {
            console.log("O navegador bloqueou a reprodução automática do som.");
        });

        setTimeout(function() {
            transicao.classList.add("finalizando");
        }, 4500);

        setTimeout(function() {
            transicao.style.display = "none";
        }, 5400);
    </script>

</body>
</html>
