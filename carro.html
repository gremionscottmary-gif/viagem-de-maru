<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivendo memórias...</title>
    <link rel="icon" type="image/png" href="favicon-carro.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* FUNDO */

        body {
            background-image: url("interior-carro.jpg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* SETA DE VOLTAR */

        .voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 65px;
            height: 65px;
        }

        .voltar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .voltar:hover img {
            transform: scale(1.1);
        }

        /* OBJETOS DO CARRO */

       .objeto {
    position: absolute;
    z-index: 2;
    object-fit: contain;
    cursor: pointer;
    animation: movimento-colagem 1.2s steps(1, end) infinite;
    transition: transform 0.2s ease;
}

.objeto:hover {
    animation-play-state: paused;
    transform: scale(1.12);
    z-index: 10;
}

        /* POLAROIDS */

       .polaroids {
    position: absolute;
    top: 30%;
    left: 11%;
    width: 38%;
    height: 26%;
    z-index: 3;
}

        .polaroid {
            position: absolute;
            width: 55%;
            height: 100%;
            padding: 7px 7px 20px;
            background: #eeeeeb;
            box-shadow: 2px 3px 5px #0006;
            transition: transform 0.25s ease;
            cursor: pointer;
        }
        .polaroid {
    animation: movimento-colagem 1.2s steps(1, end) infinite;
    transition: transform 0.2s ease;
}

.polaroid:hover {
    animation-play-state: paused;
    z-index: 10;
}

        .polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid:first-child {
            left: 0;
            top: 8%;
            transform: rotate(-11deg);
            z-index: 2;
        }

        .polaroid:last-child {
            left: 42%;
            top: -5%;
            transform: rotate(10deg);
            z-index: 1;
        }
        .polaroid:first-child {
    animation-delay: 0s;
}

.polaroid:last-child {
    animation-delay: 0.4s;
}

        .polaroid:first-child:hover {
            transform: rotate(-5deg) scale(1.08);
            z-index: 5;
        }

        .polaroid:last-child:hover {
            transform: rotate(4deg) scale(1.08);
            z-index: 5;
        }

        /* BISCOITO DOCE */

        .biscoito-doce {
            width: 25%;
            top: -8%;
            right: 12%;
            transform: rotate(12deg);
        }

        .biscoito-doce:hover {
            transform: rotate(12deg) scale(1.08);
        }

        /* BISCOITO SALGADO */

        .biscoito-salgado {
            width: 24%;
            top: 17%;
            right: -2%;
            transform: rotate(14deg);
        }

        .biscoito-salgado:hover {
            transform: rotate(14deg) scale(1.08);
        }

        /* GARRAFA D'ÁGUA */

        .garrafa {
            width: 17%;
            top: 20%;
            right: 24%;
            transform: rotate(-8deg);
        }

        .garrafa:hover {
            transform: rotate(-8deg) scale(1.08);
        }

        /* ALMOFADA */

      .almofada-area {
    position: absolute;
    left: 9%;
    bottom: 0%;
    width: 72%;
    height: 30%;
    pointer-events: none;
    z-index: 2;
}

.almofada {
    position: absolute;
    width: 100%;
    height: auto;
    left: 0;
    bottom: 0;
    pointer-events: none;
}

/* Área menor que reconhece o mouse */

.almofada-area::after {
    content: "";
    position: absolute;
    left: 20%;
    top: 20%;
    width: 55%;
    height: 65%;
    pointer-events: auto;
    cursor: pointer;
}

.almofada-area:hover .almofada {
    animation-play-state: paused;
    transform: scale(1.12);
    z-index: 5;
}

        /* ADESIVOS */

        .adesivo {
            width: 9%;
            z-index: 4;
        }

        .adesivo-1 {
            top: 5%;
            left: 5%;
            transform: rotate(-12deg);
        }

        .adesivo-2 {
            top: 57%;
            right: 5%;
            transform: rotate(12deg);
        }

        .adesivo-3 {
            bottom: 5%;
            right: 28%;
            transform: rotate(-8deg);
        }

        .adesivo:hover {
            transform: scale(1.2) rotate(0deg);
        }

        /* TELA DE CARREGAMENTO */

        #transicao-inicial {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        #transicao-inicial.finalizando {
            opacity: 0;
            pointer-events: none;
        }

        .carregamento {
            width: min(420px, 75vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 17px;
        }

        .titulo-inicial {
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .barra-fundo {
            position: relative;
            width: 100%;
            height: 17px;
            background: #171717;
            border: 2px solid #777;
            box-shadow: inset 1px 1px 3px black;
        }

        .barra-preenchida {
            width: 0%;
            height: 100%;
            background: #2868c7;
            animation: carregar 4.2s linear forwards;
        }

        @keyframes carregar {
            to {
                width: 100%;
            }
        }

        /* CARRINHO ANDANDO */

        .carro-carregando {
            position: absolute;
            width: 55px;
            height: 45px;
            bottom: 12px;
            left: 0;
            animation: andar-carro 4.2s linear forwards;
        }

        .carro-carregando img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(90deg) scaleX(-1);
        }

        @keyframes andar-carro {
            from {
                left: 0%;
            }

            to {
                left: calc(100% - 55px);
            }
        }

        /* BEM-VINDO */

        .bem-vindo {
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 15px;
            opacity: 0;
            animation: aparecer 1.5s ease 1.2s forwards;
        }

        @keyframes aparecer {
            to {
                opacity: 1;
            }
        }
        @keyframes movimento-colagem {
    0% {
        translate: 0 0;
    }

    20% {
        translate: 3px -2px;
    }

    40% {
        translate: -2px 2px;
    }

    60% {
        translate: 2px 1px;
    }

    80% {
        translate: -3px -1px;
    }

    100% {
        translate: 0 0;
    }
}
        .biscoito-doce {
    animation-delay: 0.2s;
}

.biscoito-salgado {
    animation-delay: 0.5s;
}

.garrafa {
    animation-delay: 0.8s;
}

.almofada {
    animation-delay: 0.3s;
}

.adesivo-1 {
    animation-delay: 0.6s;
}

.adesivo-2 {
    animation-delay: 0.1s;
}

.adesivo-3 {
    animation-delay: 0.9s;
}

    </style>
</head>

<body>

    <!-- SETA DE VOLTAR -->

    <a href="viagem.html" class="voltar">
        <img src="seta-voltar.png" alt="Voltar">
    </a>

    <!-- POLAROIDS -->

    <div class="polaroids">

        <div class="polaroid">
            <img src="foto-polaroid-1.jpg" alt="Fotografia 1">
        </div>

        <div class="polaroid">
            <img src="foto-polaroid-2.jpg" alt="Fotografia 2">
        </div>

    </div>

    <!-- BISCOITO DOCE -->

    <img
        src="biscoito-doce.png"
        class="objeto biscoito-doce"
        alt="Biscoito doce"
        title="Biscoito doce"
    >

    <!-- BISCOITO SALGADO -->

    <img
        src="biscoito-salgado.png"
        class="objeto biscoito-salgado"
        alt="Biscoito salgado"
        title="Biscoito salgado"
    >

    <!-- GARRAFA -->

    <img
        src="garrafa.png"
        class="objeto garrafa"
        alt="Garrafa de água"
        title="Garrafa de água"
    >

    <!-- ALMOFADA -->
<div class="almofada-area">
    <img
        src="almofada.png"
        class="objeto almofada"
        alt="Almofada"
    >
</div>
    <!-- ADESIVOS -->

    <img src="adesivo-1.png" class="objeto adesivo adesivo-1" alt="Adesivo">
    <img src="adesivo-2.png" class="objeto adesivo adesivo-2" alt="Adesivo">
    <img src="adesivo-3.png" class="objeto adesivo adesivo-3" alt="Adesivo">

    <!-- TELA DE CARREGAMENTO -->

    <div id="transicao-inicial">

        <div class="carregamento">

            <div class="titulo-inicial">
                Iniciando viagem...
            </div>

            <div class="barra-fundo">

                <div class="barra-preenchida"></div>

                <div class="carro-carregando">
                    <img src="carro-removebg-preview.png" alt="">
                </div>

            </div>

            <div class="bem-vindo">
                Bem-vindo!
            </div>

        </div>

    </div>

    <!-- SOM DE INICIALIZAÇÃO -->

    <audio id="som-inicial" src="som-windows.mp3" preload="auto"></audio>

    <script>

        const transicao = document.getElementById("transicao-inicial");
        const som = document.getElementById("som-inicial");

        som.volume = 0.35;

        som.play().catch(function() {
            console.log("O navegador bloqueou a reprodução automática do som.");
        });

        setTimeout(function() {
            transicao.classList.add("finalizando");
        }, 4500);

        setTimeout(function() {
            transicao.style.display = "none";
        }, 5400);

    </script>

</body>
</html>
