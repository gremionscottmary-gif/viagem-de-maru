
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivendo memórias...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* FUNDO DO CARRO */

        body {
            background-image: url("interior-carro.jpg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* SETA DE VOLTAR */

        .voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 65px;
            height: 65px;
            display: block;
        }

        .voltar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .voltar:hover img {
            transform: scale(1.1);
        }

        /* TELA DE CARREGAMENTO */

        #transicao-inicial {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        #transicao-inicial.finalizando {
            opacity: 0;
            pointer-events: none;
        }

        .carregamento {
            width: min(420px, 75vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 17px;
        }

        .titulo-inicial {
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 20px;
            margin-bottom: 12px;
        }

        /* BARRINHA */

        .barra-fundo {
            position: relative;
            width: 100%;
            height: 17px;
            background: #171717;
            border: 2px solid #777;
            box-shadow: inset 1px 1px 3px black;
        }

        .barra-preenchida {
            width: 0%;
            height: 100%;
            background: #2868c7;
            animation: carregar 4.2s linear forwards;
        }

        @keyframes carregar {
            to {
                width: 100%;
            }
        }

        /* CARRINHO ANDANDO */

        .carro-carregando {
            position: absolute;
            width: 55px;
            height: 45px;
            bottom: 12px;
            left: 0;
            animation: andar-carro 4.2s linear forwards;
        }

        .carro-carregando img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(90deg) scaleX(-1);
        }

        @keyframes andar-carro {
            from {
                left: 0%;
            }

            to {
                left: calc(100% - 55px);
            }
        }

        /* BEM-VINDO */

        .bem-vindo {
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 15px;
            opacity: 0;
            animation: aparecer 1.5s ease 1.2s forwards;
        }

        @keyframes aparecer {
            to {
                opacity: 1;
            }
        }

    </style>
</head>

<body>

    <!-- SETA PARA VOLTAR À ESTRADA -->

    <a href="viagem.html" class="voltar">
        <img src="seta-voltar.png" alt="Voltar">
    </a>

    <!-- TELA INICIAL -->

    <div id="transicao-inicial">

        <div class="carregamento">

            <div class="titulo-inicial">
                Iniciando viagem...
            </div>

            <div class="barra-fundo">

                <div class="barra-preenchida"></div>

                <div class="carro-carregando">
                    <img src="carro-removebg-preview.png" alt="">
                </div>

            </div>

            <div class="bem-vindo">
                Bem-vindo!
            </div>

        </div>

    </div>

    <!-- SOM DE INICIALIZAÇÃO -->

    <audio id="som-inicial" src="som-windows.mp3" preload="auto"></audio>

    <script>

        const transicao = document.getElementById("transicao-inicial");
        const som = document.getElementById("som-inicial");

        som.volume = 0.35;

        som.play().catch(function() {
            console.log("O navegador bloqueou a reprodução automática do som.");
        });

        setTimeout(function() {
            transicao.classList.add("finalizando");
        }, 4500);

        setTimeout(function() {
            transicao.style.display = "none";
        }, 5400);

    </script>

</body>
</html>
